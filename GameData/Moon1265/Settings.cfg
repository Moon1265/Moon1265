// Settings for Moon1265's MW2 mode (first-person ground combat on EVA).
// Restart KSP after changing these. Key names are Unity KeyCode names:
// https://docs.unity3d.com/ScriptReference/KeyCode.html
MOON1265_SETTINGS
{
	// Toggle: Ctrl+Shift+Y. While MW2 mode is on, all of KSP's keys are switched off
	// (Escape still opens the pause menu) and these keys are used instead.
	toggleKey = Y
	toggleNeedsCtrl = true
	toggleNeedsShift = true

	// Controls (fire = left mouse, aim down sights = right mouse)
	forwardKey = W
	backKey = S
	leftKey = A
	rightKey = D
	sprintKey = LeftShift
	jumpKey = Space
	crouchKey = C
	crouchKeyAlt = LeftControl
	reloadKey = R
	mouseSensitivity = 2
	invertMouse = false

	// Movement (metres and seconds)
	walkSpeed = 3.5
	sprintSpeed = 6
	crouchSpeed = 1.75
	aimSpeedMultiplier = 0.6   // speed while aiming down sights
	groundAcceleration = 40    // how snappy starting and stopping feels
	airAcceleration = 6        // steering while in the air
	jumpSpeed = 3.5
	crouchEyeDrop = 0.3

	// Tactical sprint: double-tap sprint and keep holding it. Faster, rifle pointed at the sky,
	// can't shoot until the rifle comes back down. Limited, recharges when not in use.
	tacticalSprintSpeed = 7.5
	tacticalSprintDuration = 4  // seconds (0 = unlimited)
	tacticalSprintRecharge = 3  // seconds to fully recharge
	doubleTapTime = 0.3         // seconds allowed between the two taps

	// Slide: press crouch while sprinting. You can look around and shoot while sliding,
	// and jump out of a slide to keep its speed.
	slideSpeed = 8.5            // starting speed (or your current speed if faster)
	slideFriction = 7           // m/s lost per second; downhill slides last longer
	slideEndSpeed = 2.5
	slideMaxTime = 1.4          // seconds
	slideSteering = 30          // degrees per second
	slideCooldown = 0.5         // seconds between slides
	slideEyeDrop = 0.12         // extra camera drop on top of crouching
	slideCameraTilt = 6         // degrees of camera roll
	sprintFovBoost = 5          // extra field of view while tactical sprinting or sliding
	// Minimum gravity in MW2 mode, so low-gravity moons (Dethmun, Minmus...) still play
	// like ground combat instead of floaty bunny hops. Set to 0 to use the real gravity.
	combatGravity = 9.81
	// KSP knocks a Kerbal over if it lands faster than this (stock is 3.5 m/s).
	stumbleThreshold = 15

	// Camera
	fieldOfView = 70
	aimFieldOfView = 45
	eyeHeight = 0.35           // metres above the Kerbal's centre

	// Rifle
	magazineSize = 30
	roundsPerMinute = 600
	reloadTime = 2.2           // seconds
	range = 1000               // metres
	hipSpread = 1.5            // degrees
	aimSpread = 0.15           // degrees
	recoil = 1.0               // degrees of view kick per shot
	soundVolume = 0.7

	// Damage
	damage = 25                // per bullet
	kerbalHealth = 100         // 4 hits
	partHealthBase = 40        // part health = base + perTonne * dry mass
	partHealthPerTonne = 400
	bulletImpulse = 0.02       // kN·s pushed into whatever is hit
	recoilImpulse = 0.004      // kN·s pushed back into the shooter
}
