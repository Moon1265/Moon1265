// Settings for Moon1265's first-person EVA mode and rifle.
// Restart KSP after changing these. Key names are Unity KeyCode names:
// https://docs.unity3d.com/ScriptReference/KeyCode.html
MOON1265_SETTINGS
{
	// Controls (fire = left mouse, aim down sights = right mouse)
	firstPersonKey = Y
	reloadKey = T
	mouseSensitivity = 2
	invertMouse = false

	// Camera
	fieldOfView = 70
	aimFieldOfView = 45
	eyeHeight = 0.35        // metres above the Kerbal's centre

	// Rifle
	magazineSize = 30
	roundsPerMinute = 600
	reloadTime = 2.2        // seconds
	range = 1000            // metres
	hipSpread = 1.5         // degrees
	aimSpread = 0.15        // degrees
	recoil = 1.0            // degrees of view kick per shot
	soundVolume = 0.7

	// Damage
	damage = 25             // per bullet
	kerbalHealth = 100      // 4 hits
	partHealthBase = 40     // part health = base + perTonne * dry mass
	partHealthPerTonne = 400
	bulletImpulse = 0.02    // kN·s pushed into whatever is hit
	recoilImpulse = 0.004   // kN·s pushed back into the shooter
}
