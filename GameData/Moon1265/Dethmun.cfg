// Dethmun: a perfectly flat moon of Kerbin with a trench around its equator.
// Requires Kopernicus (and ModuleManager, which ships with Kopernicus).
//
// Built on the Minmus template: same radius (60 km), same surface gravity
// (0.05 g) and no atmosphere. All of Minmus's terrain is stripped off, so the
// surface is a smooth sphere. The only height feature is the equatorial trench.
//
// Trench size:
//   width  -> regenerate the textures: python3 tools/generate_textures.py --trench-width <metres>
//   depth  -> change BOTH `offset` (negative) and `deformity` in VertexHeightMap below.

@Kopernicus:FOR[Moon1265]
{
	Body
	{
		name = Dethmun
		flightGlobalsIndex = 1265

		Template
		{
			name = Minmus
			removeAllPQSMods = true
		}

		Properties
		{
			displayName = Dethmun^N
			description = A moon so flat that scientists suspect it was manufactured. A single trench circles its equator, just wide enough to fly through. Kerbals keep asking about an exhaust port.

			// Identical to Minmus.
			radius = 60000
			geeASL = 0.05

			// Lets you time-warp right down to the surface: there is nothing to hit except the trench walls.
			timewarpAltitudeLimits = 0 100 200 2000 6000 12000 24000 48000

			biomeMap = Moon1265/PluginData/biomes.png
			Biomes
			{
				Biome
				{
					name = Plains
					displayName = Plains
					value = 1
					color = 1,1,1,1
				}
				Biome
				{
					name = Trench
					displayName = Trench
					value = 1.5
					color = 1,0,0,1
				}
			}
		}

		// Circular, equatorial orbit between the Mun (11.4 Mm) and Minmus (47 Mm).
		Orbit
		{
			referenceBody = Kerbin
			semiMajorAxis = 30000000
			eccentricity = 0
			inclination = 0
			longitudeOfAscendingNode = 0
			argumentOfPeriapsis = 0
			meanAnomalyAtEpoch = 2.5
			epoch = 0
			color = 0.6,0.6,0.65,1
		}

		ScaledVersion
		{
			type = Vacuum
			Material
			{
				texture = Moon1265/PluginData/scaled_color.png
				normals = Moon1265/PluginData/scaled_normal.png
			}
		}

		PQS
		{
			// Finer terrain subdivision than Minmus (about 6 m between vertices
			// at the highest level), so the trench walls come out as sharp edges
			// rather than ramps.
			maxLevel = 10

			Mods
			{
				// White in the heightmap = 0 m (the surface radius), black = trench floor.
				// height = offset + deformity * pixel, so the surface stays at exactly
				// 60 km (Minmus gravity) and the trench is cut downwards.
				VertexHeightMap
				{
					map = Moon1265/PluginData/height.png
					offset = -100
					deformity = 100
					scaleDeformityByRadius = false
					order = 20
					enabled = true
				}

				VertexColorMap
				{
					map = Moon1265/PluginData/surface_color.png
					order = 200
					enabled = true
				}
			}
		}
	}
}
